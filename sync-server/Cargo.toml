[package]
name = "takt-sync-server"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "The row-sync server Takt's Mac, iPhone and Android apps replicate their workspace through."
publish = false

[[bin]]
name = "takt-sync-server"
path = "src/main.rs"

# The server and the rules it shares with the clients build as one, against
# one lockfile and one target directory.
[workspace]
members = [".", "rules"]

[dependencies]
# The rules the server shares with every client, through the Rust core.
takt-sync-rules = { path = "rules" }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "macros", "uuid", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["compression-gzip", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true

# Dependencies build without debug info and the workspace's own crates (the
# server and the rules) with it, as in core/, cli/ and desktop/: a backtrace
# still names every frame.
[profile.dev.package."*"]
debug = false
