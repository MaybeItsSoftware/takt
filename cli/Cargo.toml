[package]
name = "takt-cli"
version = "0.3.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Command-line access to Takt's Checkvist lists, dailies, day log and workspace, and the MCP server the app bundles."
publish = false

[lib]
name = "takt_cli"
path = "src/lib.rs"

[[bin]]
name = "takt"
path = "src/main.rs"

# The hosted MCP server (`src/remote/`, docs/remote-mcp.md), built only with
# `--features remote` so the `takt` the app bundles carries no web server.
[[bin]]
name = "takt-mcp"
path = "src/bin/takt-mcp.rs"
required-features = ["remote"]

[features]
remote = ["dep:axum", "dep:tokio", "dep:jsonwebtoken"]

[dependencies]
chrono = "0.4.45"
iana-time-zone = "0.1"
clap = { version = "4.6.6", features = ["derive"] }
plist = "1.10.0"
ratatui = "0.30.2"
# The shared core (docs/rust-core-migration.md): the undo journal so far.
takt-core = { path = "../core" }
rpassword = "7.5.4"
rusqlite = "0.32"
serde_json = "1.0.151"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1.24.1", features = ["v4", "v5"] }
# The hosted MCP server's, behind the `remote` feature.
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"], optional = true }
jsonwebtoken = { version = "9", optional = true }

[profile.release]
strip = true

# Dependencies build without debug info and Takt's own crates with it: the
# rest was a quarter of a debug build's target directory and of its build
# time (measured 2026-11-19), and a backtrace still names every frame. The
# core and the sync rules are path dependencies, which `"*"` covers unless
# they are named.
[profile.dev.package."*"]
debug = false

[profile.dev.package.takt-core]
debug = true

[profile.dev.package.takt-sync-rules]
debug = true
