# Builds an UNSIGNED DMG when a `v*` tag is pushed and attaches it to the
# GitHub release. CI runners have no signing certificate (see docs/signing.md),
# so this artifact will not pass Gatekeeper on another Mac; it exists so a tag
# always has a reproducible, downloadable build next to it. The signed and
# notarised path — the one users should actually install from — is
# `scripts/build_desktop_dmg.sh <version>` run on a Mac that holds the
# Developer ID certificate.
name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
            desktop/target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('cli/Cargo.lock', 'desktop/Cargo.lock', 'core/Cargo.lock') }}

      - name: Resolve version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # The Rust app's bundle (scripts/install_desktop.sh), stopped before
      # /Applications and signed ad hoc: runners have no signing identity
      # (docs/signing.md). Its version is desktop/Cargo.toml's and its build
      # number the commit count, which fetch-depth: 0 above makes real.
      - name: Build release app
        run: |
          TAKT_BUNDLE_ONLY=1 TAKT_SIGN_IDENTITY=- scripts/install_desktop.sh
          mkdir -p dist
          cp -R build/desktop/Takt.app dist/Takt.app

      # The MCP server is the bundled CLI. A DMG without it has a --mcp-server
      # that execs nothing, which breaks every MCP client configuration on the
      # user's machine — worth failing the release for.
      - name: Verify the bundled MCP server
        run: |
          HELPER="dist/Takt.app/Contents/Helpers/takt"
          if [ ! -x "$HELPER" ]; then
            echo "::error::Built app is missing the bundled CLI at $HELPER"
            exit 1
          fi
          echo "Bundled MCP server present: $HELPER"

      - name: Package DMG
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          STAGE_DIR="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE_DIR"
          cp -R "dist/Takt.app" "$STAGE_DIR/"
          ln -s /Applications "$STAGE_DIR/Applications"

          DMG_PATH="dist/takt-v${VERSION}-unsigned.dmg"
          hdiutil create \
            -volname "Takt" \
            -srcfolder "$STAGE_DIR" \
            -format UDZO \
            "$DMG_PATH"

          shasum -a 256 "$DMG_PATH" > "${DMG_PATH}.sha256"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          append_body: true
          body: |
            Release assets generated by CI:
            - takt-v${{ steps.version.outputs.version }}-unsigned.dmg
            - takt-v${{ steps.version.outputs.version }}-unsigned.dmg.sha256

            **This DMG is unsigned and not notarised** — CI has no signing
            certificate, so Gatekeeper will block it on another Mac unless you
            right-click → Open or clear the quarantine attribute. The signed,
            notarised build comes from `scripts/build_desktop_dmg.sh` run on a Mac with
            the Developer ID certificate; see docs/signing.md.
          files: |
            dist/takt-v${{ steps.version.outputs.version }}-unsigned.dmg
            dist/takt-v${{ steps.version.outputs.version }}-unsigned.dmg.sha256
