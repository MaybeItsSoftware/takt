name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "release/**"

jobs:
  swift-tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      # Package.swift's `takt_coreFFI` binary target is built, not committed:
      # the Rust core has to exist before the package can even resolve.
      - name: Build the Rust core
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          scripts/build_core_apple.sh

      - name: Build package
        run: swift build

      - name: Run swift tests with coverage
        run: swift test --enable-code-coverage

      # The previous step ran with --enable-code-coverage, so a missing
      # profile or bundle here means the report is silently absent, not that
      # coverage is optional. Fail the step rather than print a warning nobody
      # reads in a green run.
      - name: Report code coverage
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          XCTEST_PATH=$(find "${BIN_PATH}" -name '*.xctest' -type d | head -1)
          if [ -z "$XCTEST_PATH" ]; then
            echo "::error::No .xctest bundle under ${BIN_PATH} — coverage report cannot run."
            exit 1
          fi
          EXECUTABLE="${XCTEST_PATH}/Contents/MacOS/$(basename "${XCTEST_PATH}" .xctest)"
          # Ask SwiftPM where it wrote coverage rather than guessing: the
          # folder moved from beside the bin path to inside it.
          COV_DIR=$(dirname "$(swift test --show-codecov-path)")
          PROFDATA=$(find "${COV_DIR}" -name 'default.profdata' 2>/dev/null | head -1)
          if [ -z "$PROFDATA" ]; then
            echo "::error::No default.profdata under ${COV_DIR} — swift test ran without producing coverage."
            exit 1
          fi
          xcrun llvm-cov report "${EXECUTABLE}" -instr-profile="${PROFDATA}" \
            -ignore-filename-regex='(Tests|\.build)'

  # `.swiftlint.yml` sets a 1,500-line file-length *error* and a handful of
  # length/complexity *warnings*. Deliberately not `--strict`: SwiftLint exits
  # non-zero on errors only, so an oversize file blocks the merge while the
  # remaining warnings — all type/function/file length or complexity on the
  # known large files — stay advisory. Their count and the list of files is
  # tracked in TODO.md, the single place that number lives; don't add to it.
  lint:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --reporter github-actions-logging

  # The shared Rust core (core/, docs/rust-core-migration.md).
  core:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: core-${{ runner.os }}-${{ hashFiles('core/Cargo.lock', 'sync-server/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --manifest-path core/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path core/Cargo.toml

      # The clock and merge the core shares with the sync server
      # (sync-server/rules). Its tests need no database.
      - name: Sync rules
        run: |
          cargo fmt --manifest-path sync-server/rules/Cargo.toml --check
          cargo clippy --manifest-path sync-server/rules/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path sync-server/rules/Cargo.toml

  # The CLI is the *only* MCP server — the app bundles it and `--mcp-server`
  # hands over to it — so these tests are what hold the server itself correct.
  # `mcp-smoke` below checks the handover.
  cli:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: cargo-${{ runner.os }}-${{ hashFiles('cli/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --manifest-path cli/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path cli/Cargo.toml

  # The Mac app: Rust on GPUI (docs/rust-desktop-plan.md).
  desktop:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: cargo-desktop-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock', 'core/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path desktop/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path desktop/Cargo.toml

  # The app no longer implements MCP itself: it bundles the `takt` CLI at
  # Contents/Helpers/takt and `--mcp-server` execs it. This checks the seam,
  # and specifically that a client configuration written *before* that change —
  # naming `Priority --mcp-server`, with credentials in `env` — still reaches a
  # working server. Nothing else covers that promise. Reads no real data and
  # needs no credentials.
  mcp-smoke:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
            desktop/target
          key: cargo-smoke-${{ runner.os }}-${{ hashFiles('cli/Cargo.lock', 'desktop/Cargo.lock', 'core/Cargo.lock') }}

      # The same bundle install_local.sh installs, stopped before /Applications
      # and signed ad hoc: runners have no signing identity.
      - name: Bundle the app
        run: TAKT_BUNDLE_ONLY=1 TAKT_SIGN_IDENTITY=- scripts/install_desktop.sh

      - name: Check the --mcp-server handover
        run: python3 scripts/mcp_smoke_check.py
