name: pages

# The public pages the store listings link to (the privacy policy), served by
# GitHub Pages from site/ now that no server of ours hosts them.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Optional HTML-tag verification for Google Search Console and Bing
      # Webmaster Tools, from repository variables (Settings → Secrets and
      # variables → Actions → Variables). Unset means nothing is added; use
      # them only if the domain isn't verified by DNS.
      - name: Search console verification
        env:
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
        run: |
          python3 - <<'PY'
          import html, os
          tags = ''
          for env, name in (('GOOGLE_SITE_VERIFICATION', 'google-site-verification'), ('BING_SITE_VERIFICATION', 'msvalidate.01')):
              value = os.environ.get(env, '').strip()
              if value:
                  tags += f'<meta name="{name}" content="{html.escape(value)}">\n'
          if tags:
              path = 'site/index.html'
              page = open(path).read()
              open(path, 'w').write(page.replace('<meta charset="utf-8">\n', '<meta charset="utf-8">\n' + tags, 1))
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      # Google's OAuth verification registers the copy of this policy on
      # www.maybeitssoftware.co.uk/takt/privacy (the mis-website repo), so a
      # change here has to be copied there too. That site's build fails on a
      # difference; this only warns, since the copy is always updated second.
      - name: Check the mis-website copy of the privacy policy
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import re, urllib.request
          def normalise(html):
              body = html[html.index('<h1>'):]
              body = body.split('</main>')[0]
              body = body.replace('href="../delete-account/"', 'href="https://takt.maybeitssoftware.co.uk/delete-account/"')
              return re.sub(r'>\s+<', '><', re.sub(r'\s+', ' ', body)).strip()
          ours = normalise(open('site/privacy/index.html').read())
          url = 'https://www.maybeitssoftware.co.uk/takt/privacy'
          try:
              page = urllib.request.urlopen(url, timeout=20).read().decode()
              # Next.js renders the policy inside <article class="privacyContent">.
              copy = page[page.index('<article'):page.index('</article>')]
              theirs = normalise(copy[copy.index('>') + 1:])
          except Exception as error:
              print(f'::warning::Could not read {url} to compare the privacy policy: {error}')
              raise SystemExit(0)
          if ours != theirs:
              print(f'::warning title=Privacy policy copy is stale::{url} differs from site/privacy/index.html. Google OAuth verification checks that URL: copy the policy into app/takt/privacy/page.tsx in mis-website.')
          else:
              print('The mis-website copy of the privacy policy matches.')
          PY
