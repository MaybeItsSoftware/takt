[package]
name = "takt-desktop"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "Takt's desktop app, in Rust on GPUI. See docs/rust-desktop-plan.md."

[[bin]]
name = "takt-desktop"
path = "src/main.rs"

[dependencies]
takt-core = { path = "../core" }
chrono = "0.4"
regex-lite = "0.1"
iana-time-zone = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# AppKit and Carbon for what GPUI doesn't do: the status item, global
# hotkeys, the activation policy, login items. The same `objc` GPUI uses.
objc = "0.2"
# The pill's `NSWindow`, to move it by hand (src/platform/window_move.rs).
raw-window-handle = "0.6"
# Zed's UI framework. Its Metal shaders are compiled at build time, so a
# build needs the Metal toolchain (`xcodebuild -downloadComponent
# MetalToolchain`); the `runtime_shaders` feature compiles them at launch
# instead, for a machine without it.
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
ureq = { version = "2", features = ["json"] }
# The Supabase Realtime channel sync waits on (src/sync/realtime.rs): a
# blocking client, like ureq, for the sync threads.
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
security-framework = "2"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
block = "0.1"

[profile.release]
strip = true

# Dependencies build without debug info and Takt's own crates with it: the
# rest was a third of this crate's debug target directory (measured
# 2026-11-19), and a backtrace still names every frame. The core and the
# sync rules are path dependencies, which `"*"` covers unless they are named.
[profile.dev.package."*"]
debug = false

[profile.dev.package.takt-core]
debug = true

[profile.dev.package.takt-sync-rules]
debug = true

# `objc`'s macros test a `cargo-clippy` feature in the calling crate.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dev-dependencies]
usvg = "=0.45.1"
