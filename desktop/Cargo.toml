[package]
name = "takt-desktop"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "Takt's desktop app, in Rust on GPUI: the replacement for the Swift app under Takt/. See docs/rust-desktop-plan.md."

[[bin]]
name = "takt-desktop"
path = "src/main.rs"

[dependencies]
takt-core = { path = "../core" }
chrono = "0.4"
iana-time-zone = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Zed's UI framework. `runtime_shaders` compiles the Metal shaders when the
# app starts rather than at build time, so a build needs no Metal toolchain;
# a release build should drop it once the toolchain is installed.
# AppKit and Carbon for what GPUI doesn't do: the status item, global
# hotkeys, the activation policy, login items. The same `objc` GPUI uses.
objc = "0.2"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
ureq = { version = "2", features = ["json"] }
security-framework = "2"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true

# `objc`'s macros test a `cargo-clippy` feature in the calling crate.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
